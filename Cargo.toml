[package]
name = "ruvm"
version = "0.1.0"
edition = "2021"
description = "A tiny QEMU-like machine emulator written in Rust (RISC-V 64 / AArch64)"
license = "MIT"

[lib]
name = "ruvm"
path = "src/lib.rs"

[[bin]]
name = "ruvm"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
